name = "roomprint-scan"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[kv_namespaces]]
binding = "ROOMPRINT_KV"
id = "d83e3ae3a5a94d5c9f712ff5633e8d35"

[vars]
MODEL = "claude-sonnet-5-5"
MAX_FRAMES = "80"
MAX_BODY_MB = "14"
MAX_SCANS_PER_DEVICE_PER_DAY = "6"
MAX_SCANS_PER_DAY = "150"

# Secrets (never in this file): ANTHROPIC_API_KEY, APP_KEY — set by "Deploy Roomprint scan service.command".
